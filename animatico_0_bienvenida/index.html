<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animático · Video de bienvenida</title>
<link rel="stylesheet" href="../comun/base.css">
<style>
  .escena{background:#12172b}
  .plano{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
  .globo{position:absolute;background:#fff;border-radius:34px;box-shadow:0 14px 30px rgba(31,40,76,.25);font-family:'Baskervville';font-style:italic;font-weight:600;font-size:44px;line-height:1.22;color:var(--navy);padding:30px 40px;transform-origin:70% 100%}
  .globo:after{content:'';position:absolute;bottom:-28px;width:48px;height:48px;background:#fff;clip-path:polygon(0 0,100% 0,70% 100%)}
  #globo-madre{left:44px;top:36px;width:560px;font-size:40px}#globo-madre:after{left:400px}
  #globo-func{left:1130px;top:60px;display:flex;gap:16px;padding:32px 40px}#globo-func:after{left:60px;clip-path:polygon(0 0,100% 0,30% 100%)}
  #globo-func i{width:24px;height:24px;border-radius:50%;background:var(--navy)}
  /* 3 · siluetas */
  #velo{position:absolute;inset:0;background:var(--navy)}
  #pausa{position:absolute;left:50%;top:100px;margin-left:-52px;width:104px;height:104px;border-radius:50%;background:#fff;display:flex;gap:16px;align-items:center;justify-content:center}
  #pausa i{width:16px;height:44px;border-radius:5px;background:var(--navy)}
  .fila-siluetas{position:absolute;left:0;right:0;bottom:330px;display:flex;justify-content:center;align-items:flex-end;gap:120px}
  .sil{height:540px;filter:brightness(0) invert(1);opacity:.92;transform-origin:50% 100%}
  .pildora{position:absolute;left:50%;bottom:190px;margin-left:-560px;width:1120px;text-align:center;background:#fff;color:var(--navy);border-radius:99px;padding:20px 0;font-size:44px;font-weight:700;box-shadow:0 12px 26px rgba(0,0,0,.25)}
  /* 4 · instituciones */
  #e4,#e5{background:linear-gradient(#f8f4ea,#f1e9d6)}
  #linea{position:absolute;left:260px;right:260px;top:599px;height:12px;border-radius:9px;background:var(--oro);transform-origin:0 50%}
  .inst{position:absolute;top:370px;width:400px;text-align:center}
  .verbo{font-family:'Baskervville';font-weight:600;font-size:76px;line-height:1;margin-bottom:38px;color:var(--navy)}
  .ficha-i{display:grid;place-items:center;width:250px;height:250px;margin:0 auto;border-radius:50%;background:var(--c);border:14px solid #fff;box-shadow:0 16px 30px rgba(31,40,76,.25)}
  .ficha-i svg{width:128px;height:128px}
  .inst strong{display:block;margin-top:34px;font-family:'Neulis';font-weight:400;letter-spacing:.2em;font-size:54px;color:var(--navy)}
  /* 5 · guías */
  .cinta-g{position:absolute;left:0;top:0;width:1920px;height:620px}
  .guia{position:absolute;bottom:410px;height:560px;transform-origin:50% 100%}
  .titulo-5{position:absolute;left:0;right:0;top:694px;text-align:center;font-size:36px}
  .bloques{position:absolute;left:0;right:0;top:752px;display:flex;justify-content:center;gap:70px}
  .bloques .teja{width:170px;height:170px}.bloques .teja i{inset:12px}.bloques .teja b{font-size:76px;margin-top:16px}
  /* 7 · cierre */
  #e7{background:var(--navy);display:grid;place-items:center}
  .cinta-c{position:absolute;inset:0;width:100%;height:100%}
  #pregunta{position:relative;font-family:'Baskervville';font-size:128px;line-height:1.08;color:#fff;text-align:center}
</style>
</head>
<body>
<div id="marco"><div id="escenario">
  <div class="escena" id="e1"><img class="plano" src="../storyboard_0_bienvenida/img/v1_espera.png" alt=""></div>
  <div class="escena" id="e2"><img class="plano" src="../storyboard_0_bienvenida/img/v2_pregunta.png" alt="">
    <p class="globo" id="globo-madre">¿Qué tengo que hacer para que mi hijo tenga documentos?</p>
    <div id="velo"></div><span id="pausa"><i></i><i></i></span>
    <div class="fila-siluetas"><img class="sil" src="../comun/img/directora.png" alt=""><img class="sil" src="../comun/img/vecina.png" alt=""><img class="sil" src="../comun/img/docente.png" alt=""><img class="sil" src="../comun/img/gaby.png" alt=""></div>
    <p class="pildora" id="txt-personal">Personal docente, administrativo y directivo</p>
  </div>
  <div class="escena" id="e4">
    <span class="puntos" style="right:90px;top:90px;width:300px;height:240px"></span><span class="puntos" style="left:90px;bottom:120px;width:240px;height:180px"></span>
    <span id="linea"></span>
    <div class="inst" id="i-mep" style="left:260px"><p class="verbo">Promueve</p><span class="ficha-i" style="--c:var(--ambar)"><svg viewBox="0 0 24 24"><path d="M12 3 2.500 9.200V11H4v9h6v-5h4v5h6v-9h1.500V9.200zM12 6.200a1.700 1.700 0 1 1 0 3.400 1.700 1.700 0 0 1 0-3.400z" fill="#fff"/></svg></span><strong>MEP</strong></div>
    <div class="inst" id="i-dgme" style="left:760px"><p class="verbo">Ejecuta</p><span class="ficha-i" style="--c:var(--naranja)"><svg viewBox="0 0 24 24"><path d="M12 2.500 3 7.500V9h18V7.500zM5 10.500h2.400v7H5zm5.800 0h2.400v7h-2.400zm5.800 0H19v7h-2.400zM3.500 19h17v2.500h-17z" fill="#fff"/></svg></span><strong>DGME</strong></div>
    <div class="inst" id="i-pani" style="left:1260px"><p class="verbo">Protege</p><span class="ficha-i" style="--c:var(--teal)"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6.200c0 4.900 3.300 9.200 8 10.800 4.700-1.600 8-5.900 8-10.800V5z" fill="#fff"/><path d="M12 16.300l-.7-.6c-2.300-2-3.600-3.200-3.600-4.800a2.300 2.300 0 0 1 4.300-1.200 2.300 2.300 0 0 1 4.300 1.200c0 1.600-1.300 2.800-3.600 4.800z" fill="#00a99d"/></svg></span><strong>PANI</strong></div>
  </div>
  <div class="escena" id="e5">
    <span class="puntos" style="left:80px;top:80px;width:240px;height:210px"></span>
    <svg class="cinta-g" viewBox="0 0 1920 620" preserveAspectRatio="none"><path id="cinta-path" d="M-40 470 C 300 560, 520 380, 800 430 S 1180 560, 1330 330 S 1520 60, 1700 180 S 1820 470, 1990 420" fill="none" stroke="#efc445" stroke-width="34" stroke-linecap="round"/></svg>
    <img class="guia" id="g-andres" style="left:360px" src="../comun/img/andres.png" alt=""><img class="guia" id="g-gaby" style="left:835px" src="../comun/img/gaby.png" alt=""><img class="guia" id="g-charly" style="left:1250px" src="../comun/img/charly.png" alt="">
    <p class="rotulo titulo-5" id="txt-bloques">Bloques 1 a 4</p>
    <div class="bloques"><span class="teja"><i style="background:var(--cian)"></i><b>1</b></span><span class="teja"><i style="background:var(--ambar)"></i><b>2</b></span><span class="teja"><i style="background:var(--naranja)"></i><b>3</b></span><span class="teja"><i style="background:var(--teal)"></i><b>4</b></span></div>
  </div>
  <div class="escena" id="e6"><img class="plano" src="../storyboard_0_bienvenida/img/v6_respuesta.png" alt=""><p class="globo" id="globo-func"><i></i><i></i><i></i></p></div>
  <div class="escena" id="e7"><svg class="cinta-c" viewBox="0 0 1920 1080" preserveAspectRatio="none"><path d="M-60 880 C 320 990, 620 760, 960 820 S 1500 960, 1620 640 S 1760 240, 1990 330" fill="none" stroke="#cdaa66" stroke-width="26" stroke-linecap="round"/></svg><p id="pregunta">¿Qué le respondería<br>usted hoy?</p></div>
</div></div>
<div id="controles">
  <button id="btn-play" type="button">▶ Reproducir</button>
  <span id="tiempo">0:00 / 1:30</span>
  <div id="pista"><input id="barra" type="range" min="0" value="0" aria-label="Posición del video"><div id="capitulos"></div></div>
  <button id="btn-subs" type="button">Subtítulos</button>
  <button id="btn-pantalla" type="button">Pantalla completa</button>
</div>
<script src="../comun/lib/gsap.min.js"></script>
<script src="../comun/motor.js"></script>
<script src="audio/duraciones.js"></script>
<script src="escenas.js"></script>
</body>
</html>
